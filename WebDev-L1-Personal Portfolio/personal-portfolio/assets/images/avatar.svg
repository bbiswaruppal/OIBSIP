<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGrad)" filter="url(#avatarGlow)" />

  <!-- Inner Soft Ring -->
  <circle cx="200" cy="200" r="176" fill="#0b0f19" opacity="0.4" />

  <!-- Tech Geometric Accents -->
  <circle cx="90" cy="110" r="4" fill="#a5b4fc" opacity="0.8" />
  <circle cx="310" cy="120" r="6" fill="#67e8f9" opacity="0.8" />
  <circle cx="320" cy="280" r="5" fill="#c084fc" opacity="0.7" />
  <circle cx="80" cy="270" r="5" fill="#6ee7b7" opacity="0.7" />

  <!-- Floating Code Brackets Accent -->
  <text x="60" y="200" fill="#818cf8" font-family="monospace" font-size="28" font-weight="bold" opacity="0.45">&lt;/&gt;</text>
  <text x="315" y="210" fill="#38bdf8" font-family="monospace" font-size="26" font-weight="bold" opacity="0.45">{ ; }</text>

  <!-- Character / Developer Silhouette -->
  <!-- Hoodie / Shoulders -->
  <path d="M 90 380 C 100 310, 140 270, 200 270 C 260 270, 300 310, 310 380 Z" fill="url(#hoodieGrad)" />
  <!-- Inner Collar / Shirt -->
  <path d="M 165 275 L 200 315 L 235 275 Z" fill="#6366f1" opacity="0.8" />
  <!-- Neck -->
  <rect x="175" y="225" width="50" height="60" rx="10" fill="url(#skinGrad)" />
  <path d="M 175 250 C 185 260, 215 260, 225 250 Z" fill="#d97706" opacity="0.4" />

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="145" cy="185" r="14" fill="#f59e0b" />
  <circle cx="255" cy="185" r="14" fill="#f59e0b" />

  <!-- Hair Modern Cut -->
  <path d="M 140 170 C 135 130, 160 100, 200 95 C 245 95, 265 125, 260 165 C 250 145, 235 140, 215 140 C 190 140, 175 145, 155 158 Z" fill="url(#hairGrad)" />

  <!-- Modern Glasses / Eyewear -->
  <rect x="156" y="166" width="36" height="24" rx="8" fill="none" stroke="#ffffff" stroke-width="4" />
  <rect x="208" y="166" width="36" height="24" rx="8" fill="none" stroke="#ffffff" stroke-width="4" />
  <line x1="192" y1="178" x2="208" y2="178" stroke="#ffffff" stroke-width="4" />
  <!-- Lens reflections -->
  <path d="M 162 172 L 180 172" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 214 172 L 232 172" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="178" r="4" fill="#1e1b4b" />
  <circle cx="226" cy="178" r="4" fill="#1e1b4b" />

  <!-- Smile -->
  <path d="M 184 214 Q 200 226 216 214" fill="none" stroke="#92400e" stroke-width="3.5" stroke-linecap="round" />

  <!-- Coding Headset / Earphones -->
  <path d="M 142 165 C 142 120, 258 120, 258 165" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <rect x="135" y="165" width="14" height="26" rx="6" fill="#0ea5e9" />
  <rect x="251" y="165" width="14" height="26" rx="6" fill="#0ea5e9" />
</svg>
